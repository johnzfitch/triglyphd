[package]
name = "triglyphd"
version = "0.1.0"
edition = "2021"
description = "D-Bus daemon for triglyph trigram search - Nautilus integration"
license = "MIT"
keywords = ["trigram", "search", "dbus", "nautilus", "gnome"]

[[bin]]
name = "triglyphd"
path = "src/main.rs"

[dependencies]
# Core indexing
triglyph = { path = "../triglyph" }
memmap2 = "0.9"

# D-Bus integration (zbus is the modern async D-Bus crate)
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "fs"] }

# File walking (respects .gitignore)
ignore = "0.4"

# Parallel processing
rayon = "1.10"

# Progress bars
indicatif = "0.17"

# Utilities
blake3 = "1.5"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

# Serialization (metadata only)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI (for one-shot commands)
clap = { version = "4", features = ["derive"] }

# Tracing for debugging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
